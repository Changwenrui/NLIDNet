[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nlidnet"
version = "0.1.0"
description = "Active hydrodynamic interrogation with event-based liquid response encoding"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.1", "torchvision>=0.16", "safetensors>=0.4", "PyYAML>=6.0", "scikit-learn>=1.3", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["build>=1"]
baselines = ["timm>=0.9", "opencv-python>=4.10", "spikingjelly>=0.0.0.0.14"]
media = ["pillow>=10", "imageio-ffmpeg>=0.5"]

[project.scripts]
nlidnet = "nlidnet.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nlidnet*"]

